services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ferry
      POSTGRES_DB: ferry
    volumes:
      - ferry_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ferry -d ferry']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Web UI and HTTP API. Applies database migrations on start.
  api:
    image: ghcr.io/rasmusaasmae/praamipiletid:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://ferry:ferry@postgres:5432/ferry
      APP_URL: ${APP_URL:-https://praamipiletid.aasmae.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      POCKET_ID_URL: ${POCKET_ID_URL:-https://auth.aasmae.com}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID}
      POCKET_ID_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET}
      PRAAMID_CRED_KEY: ${PRAAMID_CRED_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Swap cycle, praamid.ee login bot and email. Waits for the API so the
  # schema is migrated first.
  worker:
    image: ghcr.io/rasmusaasmae/praamipiletid:latest
    command: ['bun', 'apps/worker/src/main.ts']
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ferry:ferry@postgres:5432/ferry
      PRAAMID_CRED_KEY: ${PRAAMID_CRED_KEY}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-10000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    # Headless Chromium needs more shared memory than Docker's default.
    shm_size: 1gb
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: unless-stopped

volumes:
  ferry_pg:
